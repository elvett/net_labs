services:
  db:
    image: redis:8-alpine
    container_name: db_redis
    networks:
      - lab1-net

  app:
    build: .
    image: lab1-app:1.0
    container_name: app
    depends_on:
      - db
    networks:
      - lab1-net

  proxy:
    image: nginx:1.30-alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - lab1-net

networks:
  lab1-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
