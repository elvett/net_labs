name: lab3-monitoring

services:
  zabbix-db:
    image: postgres:${POSTGRES_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_TAG}
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      zabbix-db:
        condition: service_healthy
    networks: [monitoring]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_TAG}
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PHP_TZ: Europe/Kyiv
    ports:
      - "8081:8080"
    depends_on:
      - zabbix-server
    networks: [monitoring]

  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZABBIX_TAG}
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:?undefied DOCKER_GID у .env}"  
    networks: [monitoring]

  net-device:
    build: ./net-device
    image: lab3/net-device:1.0
    restart: unless-stopped
    networks: [monitoring]

  grafana:
    image: grafana/grafana:${GRAFANA_TAG}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?undefied GRAFANA_ADMIN_PASSWORD у .env}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app ${GRAFANA_ZABBIX_PLUGIN_VERSION}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - zabbix-web
    networks: [monitoring]

networks:
  monitoring:
    name: monitoring_net
    ipam:
      config:
        - subnet: 10.88.0.0/24

volumes:
  zabbix-db-data:
  grafana-data:
